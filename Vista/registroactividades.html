<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --ink: #20242b;
            --muted: #6b7280;
            --line: #e7e9ee;
            --surface: #fff;
            --bg: #f4f6f9;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .page-header {
            background: #17191e;
            color: #fff;
            padding: 2.5rem 1rem;
        }

        .page-header p {
            color: #c9cbd1;
            margin-bottom: 0;
        }

        .form-card {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--surface);
            box-shadow: 0 8px 28px rgba(20, 25, 35, .05);
        }

        .form-card h2 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .section-number {
            display: inline-grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #20242b;
            color: #fff;
            font-size: .9rem;
            margin-right: .55rem;
        }

        .form-label {
            font-weight: 600;
            font-size: .9rem;
        }

        .form-control,
        .form-select {
            min-height: 44px;
            border-color: #dfe3e9;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #687386;
            box-shadow: 0 0 0 .2rem rgba(80, 90, 110, .12);
        }

        .btn-dark {
            background: #20242b;
            border-color: #20242b;
        }

        .btn-dark:hover {
            background: #080a0d;
            border-color: #080a0d;
        }

        .required-note {
            color: var(--muted);
            font-size: .82rem;
        }

        footer {
            color: var(--muted);
            font-size: .85rem;
        }
    </style>
    </style>
</head>

<body>
    <h2 class="titulo-tabla">Tabla de actividades</h2>

    <div class="card shadow-sm contenedor-tabla">
        <div class="card shadow-sm">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col">Actividad</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Municipio</th>
                            <th scope="col">Total recaudo</th>
                            <th id="encabezadoAcciones" class="d-none" scope="col">
                                Acciones
                            </th>
                        </tr>
                    </thead>
                    <tbody id="listaActividades">
                        <tr>
                            <td colspan="5" class="text-center py-4">
                                Cargando actividades...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <a href="Actividades.html" >
            <button type="button" class="btn btn-sm boton-rosa m-3">
                Nueva actividad
            </button>
        </a>
</body>

</html>
    <main class="container py-5">
       
        <!-- 1. Registro de Actividades -->
        <section class="form-card p-4 p-md-5 mb-4">
            <h2 class="mb-4"><span class="section-number">1</span>Registro de Actividades</h2>
            <form>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="actividad">Nombre de la actividad *</label>
                        <input class="form-control" id="actividad" name="actividad" type="text"
                            placeholder="Ej. Reunión de asociados" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="tipoActividad">Tipo de actividad *</label>
                        <select class="form-select" id="tipoActividad" name="tipoActividad" required>
                            <option value="">Seleccione una opción</option>
                            <option>Reunión</option>
                            <option>Capacitación</option>
                            <option>Evento</option>
                            <option>Jornada comunitaria</option>
                            <option>Otra</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="fechaActividad">Fecha *</label>
                        <input class="form-control" id="fechaActividad" name="fechaActividad" type="date" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="horaActividad">Hora</label>
                        <input class="form-control" id="horaActividad" name="horaActividad" type="time">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="lugarActividad">Lugar</label>
                        <input class="form-control" id="lugarActividad" name="lugarActividad" type="text"
                            placeholder="Lugar donde se realizará">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="responsableActividad">Responsable *</label>
                        <input class="form-control" id="responsableActividad" name="responsableActividad" type="text"
                            placeholder="Nombre del responsable" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="descripcionActividad">Descripción</label>
                        <textarea class="form-control" id="descripcionActividad" name="descripcionActividad" rows="3"
                            placeholder="Detalles de la actividad"></textarea>
                    </div>
                    <div class="col-12 d-flex gap-2 justify-content-end">
                        <button class="btn btn-outline-secondary" type="reset">Limpiar</button>
                        <button class="btn btn-dark px-4" type="submit">Registrar actividad</button>
                    </div>
                </div>
            </form>
        </section>
        <script src="../controlador/Actividades.js"></script>
</body>


</html>
