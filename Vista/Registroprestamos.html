<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --ink: #20242b;
            --muted: #6b7280;
            --line: #e7e9ee;
            --surface: #fff;
            --bg: #f4f6f9;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }

        .page-header {
            background: #17191e;
            color: #fff;
            padding: 2.5rem 1rem;
        }

        .page-header p {
            color: #c9cbd1;
            margin-bottom: 0;
        }

        .form-card {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--surface);
            box-shadow: 0 8px 28px rgba(20, 25, 35, .05);
        }

        .form-card h2 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .section-number {
            display: inline-grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #20242b;
            color: #fff;
            font-size: .9rem;
            margin-right: .55rem;
        }

        .form-label {
            font-weight: 600;
            font-size: .9rem;
        }

        .form-control,
        .form-select {
            min-height: 44px;
            border-color: #dfe3e9;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #687386;
            box-shadow: 0 0 0 .2rem rgba(80, 90, 110, .12);
        }

        .btn-dark {
            background: #20242b;
            border-color: #20242b;
        }

        .btn-dark:hover {
            background: #080a0d;
            border-color: #080a0d;
        }

        .required-note {
            color: var(--muted);
            font-size: .82rem;
        }

        footer {
            color: var(--muted);
            font-size: .85rem;
        }
    </style>
    </style>
</head>

<body>
    <main class="container py-5">
       
         <section class="form-card p-4 p-md-5 mb-4">
      <h2 class="mb-4"><span class="section-number">2</span>Registro de Pago</h2>
      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="asociadoPago">Asociado *</label>
            <input class="form-control" id="asociadoPago" name="asociadoPago" type="text" placeholder="Nombre o identificación del asociado" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="conceptoPago">Concepto del pago *</label>
            <select class="form-select" id="conceptoPago" name="conceptoPago" required>
              <option value="">Seleccione el concepto</option>
              <option>Cuota de afiliación</option><option>Cuota mensual</option><option>Abono a préstamo</option><option>Multa</option><option>Otro</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="valorPago">Valor del pago (COP) *</label>
            <input class="form-control" id="valorPago" name="valorPago" type="number" min="1" step="1" placeholder="Ej. 50000" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="fechaPago">Fecha del pago *</label>
            <input class="form-control" id="fechaPago" name="fechaPago" type="date" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="metodoPago">Método de pago *</label>
            <select class="form-select" id="metodoPago" name="metodoPago" required>
              <option value="">Seleccione el método</option>
              <option>Efectivo</option><option>Transferencia bancaria</option><option>Consignación</option><option>Otro</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="referenciaPago">Número de recibo o referencia</label>
            <input class="form-control" id="referenciaPago" name="referenciaPago" type="text" placeholder="Número de comprobante">
          </div>
          <div class="col-12">
            <label class="form-label" for="observacionesPago">Observaciones</label>
            <textarea class="form-control" id="observacionesPago" name="observacionesPago" rows="3" placeholder="Información adicional"></textarea>
          </div>
          <div class="col-12 d-flex gap-2 justify-content-end">
            <button class="btn btn-outline-secondary" type="reset">Limpiar</button>
            <button class="btn btn-dark px-4" type="submit">Registrar pago</button>
          </div>
        </div>
      </form>
    </section>
</body>

</html>
