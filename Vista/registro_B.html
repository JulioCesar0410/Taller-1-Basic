<!-- FORMULARIO DE REGISTRO -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
    <div class="tab-pane fade" id="pills-register" role="tabpanel" aria-labelledby="pills-register-tab">
                <form>
                    <div class="mb-3">
                        <label for="regName" class="form-label">Nombre Completo</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="regName" placeholder="Juan Pérez" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="regEmail" class="form-label">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="regEmail" placeholder="nombre@acerias.com" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="regPassword" class="form-label">Contraseña Nueva</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="regPassword" placeholder="Mínimo 8 caracteres" required>
                        </div>
                    </div>
                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label small" for="terms">
                            Acepto los <a href="#" class="text-decoration-none">Términos y Condiciones</a>
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Crear Cuenta</button>
                </form>
            </div>
</body>
</html>
