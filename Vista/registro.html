<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto without rus </title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div>
        <h2>
                Registro De Formulario
            </h2>
        <form id="registro" action="../modelo/guardarAsociado.php" method="post">

            <div class="gupo-input">
                <label for="">Ingresar Documeto</label>
                <input id="documento" name="documento" type="number" placeholder="ej:1002479296" required>
            </div>

            <div class="gupo-input">
                <label for="">nombre</label>
                <input id="nombre" name="nombre" type="text" placeholder="Cesar" required>
            </div>

            <div class="gupo-input">
                <label for="apellido">Apellido</label>
                  <input id="apellido" name="apellido" type="text" placeholder="Manrique" required>
            </div>

              <div class="gupo-input">
                  <label for="telefono">Teléfono</label>
                  <input id="telefono" name="telefono" type="tel" required>
            </div>

              <div class="gupo-input">
                  <label for="">email</label>
                  <input id="email" name="email" type="email" placeholder="Juliomanrique@gmail.com" required>
            </div>

                <div class="gupo-input">
                  <label for="fechaNacimiento">Fecha De Nacimiento</label>
                  <input id="fechaNacimiento" name="fechaNacimiento" type="date" required>
              </div>


              <div class="gupo-input">
                  <label for="direccion">Dirección</label>
                  <input id="direccion" name="direccion" type="text" required>
              </div>
            
               <div class="gupo-input">
                  <label for="">ciudad</label>
                  <select name="ciudad" id="ciudad" required>
                <option value="Duitama">Duitama</option>
                <option value="Sogamoso">Sogamoso</option>
                <option value="Bogota">Bogota</option>
                </select>
            </div>
            <div class="div grupo-input">
                <label for="contraseña">crear contraseña</label>
                  <input id="contraseña" name="contraseña" type="password" required>
            </div>

            <div class="div grupo-input">
                <label for="confirmar_contraseña">confirmar contraseña</label>
                  <input id="confirmar_contraseña" name="confirmar_contraseña" type="password" required>
            </div>
               <div class="gupo-input"><label for="">genero: </label></div> 
             <div class="gupo-input">
                <input id="Masculino" type="radio" name="genero" value="Masculino" required>
                <label for="Masculino">Masculino</label>
                <input id="Femenino" type="radio" name="genero" value="Femenino">
                <label for="Femenino">Femenino</label>
                <input id="Otro" type="radio" name="genero" value="Otro">
                <label for="Otro">Otro</label>
                
            </div>
            <div class="gupo-button">
            <button type="submit" class="btn btn-primary">Enviar Formulario</button>
            <button type="reset" class="btn btn-secondary">Limpiar Formulario</button>

            </div>
            <p id = "mensajeRegistro" role = "status" aria-live="polite"></p>

        
        </form>


    </div>
    <script src="../controlador/Asociado.js"></script>
</body>
</html>
